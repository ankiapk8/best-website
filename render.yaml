services:
  - type: web
    name: anki-generator
    env: docker
    plan: free
    region: oregon # or your preferred region
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      - key: DATABASE_URL
        sync: false # Set this to your PostgreSQL Internal Database URL
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false # Set your OpenAI API Key here
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        value: https://api.openai.com/v1 # Default OpenAI base URL

    healthCheckPath: /api/healthz # Matches the API route
    autoDeploy: true

